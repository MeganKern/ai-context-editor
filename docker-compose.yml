services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-harness_v2}
      POSTGRES_USER: ${POSTGRES_USER:-ace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ace}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ace} -d ${DB_NAME:-harness_v2}"]
      interval: 5s
      timeout: 3s
      retries: 5

  cliproxy:
    build:
      context: .
      dockerfile: cliproxy.Dockerfile
    restart: unless-stopped
    ports:
      - "${CLIPROXY_PORT:-8317}:8317"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-ace}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ace}
      DB_NAME: ${DB_NAME:-harness_v2}
      API_HOST: "0.0.0.0"
      API_PORT: 3710
      CLIPROXY_URL: http://cliproxy:8317
      WORKSPACES_ROOT: /data/workspaces
      ALLOWED_HOSTS: "localhost:${APP_PORT:-3000},127.0.0.1:${APP_PORT:-3000},app:3710,localhost:3710"
    volumes:
      - ./data/workspaces:/data/workspaces
    ports:
      - "${APP_PORT:-3000}:3710"
